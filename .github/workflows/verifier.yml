name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntaxe, fichiers cités, voix de la VHF, poids
        run: node outils/verifier.cjs
